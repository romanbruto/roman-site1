<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Воспоминания</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0e0e0e;
      color: #f0f0f0;
      font-family: Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    h1 {
      font-size: 3rem;
      color: #ffc107;
      margin-bottom: 0.5em;
    }
    p {
      max-width: 600px;
      font-size: 1.2rem;
      line-height: 1.6;
      text-align: center;
    }
    img {
      margin-top: 2rem;
      max-width: 300px;
    }
  </style>
</head>
<body>
  <h1>Воспоминания</h1>
  <p>Где музыка звучит — там сердце оживает.<br>
  И каждый аккорд — это шаг по памяти, где любовь была реальностью.</p>
  <p>«Где ночь плывёт по грифу, как по реке струна —<br>
  Там жил однажды голос, что знал её сполна.»</p>
  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/29/Lion_with_Crown.svg/512px-Lion_with_Crown.svg.png" alt="Лев с короной">
</body>
</html>
